<!-- Écran de connexion -->
<div *ngIf="!isConnected" class="connect-screen">
  <app-wallet-connect (walletConnected)="onWalletConnected($event)"></app-wallet-connect>
</div>

<!-- Application principale -->
<div *ngIf="isConnected" class="app-container" fxLayout="column">
  
  <!-- Header -->
  <mat-toolbar class="app-header" color="primary">
    <div class="header-content" fxLayout="row" fxLayoutAlign="space-between center">
      <div class="app-title" fxLayout="row" fxLayoutAlign="start center">
        <mat-icon class="app-icon">account_balance_wallet</mat-icon>
        <span>{{ title }}</span>
      </div>
      <div class="header-actions" fxLayout="row" fxLayoutAlign="end center">
        <button mat-icon-button class="header-button" (click)="disconnectWallet()" matTooltip="Déconnexion">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </mat-toolbar>

  <!-- Main Content -->
  <div class="main-content" fxFlex>
    
    <!-- Wallet Address Display -->
    <div class="wallet-section" fxLayout="column" fxLayoutAlign="center center">
      <div class="wallet-address" fxLayout="row" fxLayoutAlign="center center">
        <mat-icon class="wallet-icon">account_circle</mat-icon>
        <span class="address-text">{{ walletAddress.substring(0, 10) }}...{{ walletAddress.substring(walletAddress.length - 8) }}</span>
        <button mat-icon-button class="copy-button" matTooltip="Copier l'adresse">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Staked Balance Tab -->
      <div *ngIf="selectedTab === 0" class="tab-panel">
        <app-staked-balance [walletAddress]="walletAddress"></app-staked-balance>
      </div>
      
      <!-- History Tab -->
      <div *ngIf="selectedTab === 1" class="tab-panel">
        <app-staking-history [walletAddress]="walletAddress"></app-staking-history>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <div class="bottom-nav" fxLayout="row" fxLayoutAlign="space-around center">
    <button 
      class="nav-button" 
      [class.active]="selectedTab === 0"
      (click)="selectedTab = 0">
      <mat-icon>trending_up</mat-icon>
      <span>Staké</span>
    </button>
    <button 
      class="nav-button" 
      [class.active]="selectedTab === 1"
      (click)="selectedTab = 1">
      <mat-icon>history</mat-icon>
      <span>Historique</span>
    </button>
  </div>
</div>
